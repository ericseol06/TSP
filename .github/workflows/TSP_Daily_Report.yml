name: TSP Combined Daily Report

on:
  schedule:
    # Runs at 00:30 UTC Tuesday-Saturday (8:30 PM EDT Monday-Friday)
    - cron: '30 0 * * 2-6'
  workflow_dispatch: # Allows manual triggers anytime

jobs:
  run-tsp-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests urllib3 matplotlib mplfinance

      - name: Execute TSP Combined Daily Report
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python TSP_Combined_Daily_Report_v2g.py
