name: TSP Combined Daily Report

on:
  schedule:
    # Runs Monday through Friday at 21:00 UTC (4:00 PM EST / 5:00 PM EDT)
    # Adjust time as needed after TSP prices and Yahoo Finance data finalize
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions tab

jobs:
  run-tsp-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up execution by caching pip dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests urllib3 matplotlib mplfinance

      - name: Execute TSP Combined Daily Report
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python TSP_Combined_Daily_Report_v2g.py
